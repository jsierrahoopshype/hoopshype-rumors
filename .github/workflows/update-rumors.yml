name: Update HoopsHype Rumors

# Grant permissions to write to repository
permissions:
  contents: write

on:
  # Run every 60 minutes
  schedule:
    - cron: '0 * * * *'  # Every hour at minute 0
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  update-rumors:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
    
    - name: Run scraper
      env:
        HOOPSHYPE_USERNAME: ${{ secrets.HOOPSHYPE_USERNAME }}
        HOOPSHYPE_PASSWORD: ${{ secrets.HOOPSHYPE_PASSWORD }}
      run: |
        python update_rumors.py
    
    - name: Check for changes
      id: check_changes
      run: |
        if git diff --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit and push changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add hoopshype_rumors_part*.json rumors_index.json hoopshype_rumors_latest.json
        git commit -m "Auto-update: Added new rumors from $(date +'%Y-%m-%d')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload to Cloudflare R2
      if: steps.check_changes.outputs.changes == 'true'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: https://c115ab4a70911c885646b6ba49b1692e.r2.cloudflarestorage.com
      run: |
        # Upload all JSON data files to R2
        for file in hoopshype_rumors_latest.json hoopshype_rumors_part*.json rumors_index.json; do
          if [ -f "$file" ]; then
            aws s3 cp "$file" "s3://hoopshype-rumors/$file" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "application/json"
            echo "✅ Uploaded $file to R2"
          fi
        done
    
    - name: Summary
      if: steps.check_changes.outputs.changes == 'true'
      run: echo "✅ Successfully updated rumors database and synced to R2!"
    
    - name: No updates
      if: steps.check_changes.outputs.changes == 'false'
      run: echo "ℹ️ No new rumors found"
