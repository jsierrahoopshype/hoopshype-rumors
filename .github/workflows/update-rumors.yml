name: Update HoopsHype Rumors

# Grant permissions to write to repository
permissions:
  contents: write

on:
  # Run every 60 minutes
  schedule:
    - cron: '0 * * * *'  # Every hour at minute 0
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  update-rumors:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
    
    - name: Download current data from R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: https://c115ab4a70911c885646b6ba49b1692e.r2.cloudflarestorage.com
      run: |
        # Download existing JSON files from R2 so scraper can update them
        for file in hoopshype_rumors_latest.json hoopshype_rumors_part1.json hoopshype_rumors_part2.json hoopshype_rumors_part3.json hoopshype_rumors_part4.json hoopshype_rumors_part5.json hoopshype_rumors_part6.json hoopshype_rumors_part7.json rumors_index.json; do
          aws s3 cp "s3://hoopshype-rumors/$file" "$file" \
            --endpoint-url "$R2_ENDPOINT" || echo "⚠️ Could not download $file (may not exist yet)"
        done
    
    - name: Run scraper
      id: scraper
      env:
        HOOPSHYPE_USERNAME: ${{ secrets.HOOPSHYPE_USERNAME }}
        HOOPSHYPE_PASSWORD: ${{ secrets.HOOPSHYPE_PASSWORD }}
      run: |
        python update_rumors.py
        # Check if any JSON files were modified
        if [ -f "hoopshype_rumors_latest.json" ]; then
          echo "has_data=true" >> $GITHUB_OUTPUT
        else
          echo "has_data=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Upload to Cloudflare R2
      if: steps.scraper.outputs.has_data == 'true'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: https://c115ab4a70911c885646b6ba49b1692e.r2.cloudflarestorage.com
      run: |
        # Upload all JSON data files to R2
        for file in hoopshype_rumors_latest.json hoopshype_rumors_part*.json rumors_index.json; do
          if [ -f "$file" ]; then
            aws s3 cp "$file" "s3://hoopshype-rumors/$file" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "application/json"
            echo "✅ Uploaded $file to R2"
          fi
        done
    
    - name: Summary
      if: steps.scraper.outputs.has_data == 'true'
      run: echo "✅ Successfully updated rumors database in R2!"
    
    - name: No data
      if: steps.scraper.outputs.has_data == 'false'
      run: echo "⚠️ No data files generated"
